name: "Alerta aluguel · São Sebastião + Jardim Botânico"

on:
  schedule:
    - cron: "7 */2 * * *"   # horário UTC (Brasília = UTC-3)
  workflow_dispatch:
    inputs:
      seed:
        description: "Só marcar como visto (sem notificar cada anúncio)"
        type: boolean
        default: false

# Um monitor por vez: evita dois jobs gravando monitor/state ao mesmo tempo.
concurrency:
  group: monitor-state
  cancel-in-progress: false

permissions:
  contents: write   # commitar o estado
  actions: write    # pausar/reativar o workflow do ssjb pela trava de orçamento

jobs:
  monitor:
    runs-on: ubuntu-latest
    # teto rígido de minutos por job (se algo travar, não queima o orçamento do mês)
    timeout-minutes: 15
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
      TZ: America/Sao_Paulo
    steps:
      - name: Marcar início (para a trava de orçamento)
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Checar orçamento de minutos
        id: orc
        run: node monitor/orcamento.js checar --grupo=ssjb


      - if: steps.orc.outputs.rodar == 'true'
        run: npm ci --omit=dev

      - name: Cache do Chromium
        if: steps.orc.outputs.rodar == 'true'
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cache HTTP dos scripts dos portais
        if: steps.orc.outputs.rodar == 'true'
        uses: actions/cache@v4
        with:
          path: monitor/.cache_http
          key: http-${{ github.run_id }}
          restore-keys: http-

      - name: Instalar Chromium
        if: steps.orc.outputs.rodar == 'true'
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Rodar monitor (ssjb)
        if: steps.orc.outputs.rodar == 'true'
        run: node monitor/run.js --grupo=ssjb ${{ inputs.seed && '--seed' || '' }}

      - name: Registrar minutos usados
        if: always()
        run: node monitor/orcamento.js registrar --inicio="$INICIO"

      - name: Pausar ssjb se o orçamento do mês acabou
        if: always() && steps.orc.outputs.esgotado == 'true'
        run: gh workflow disable monitor-ssjb.yml || true

      - name: Salvar estado (anúncios já vistos + minutos)
        if: always()
        run: |
          git config user.name "alerta-aluguel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor/state/vistos.json monitor/state/geocache.json monitor/state/execucoes.jsonl monitor/state/minutos.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -m "estado: ssjb $(date +'%d/%m %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
