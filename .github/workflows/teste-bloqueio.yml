name: "TEMP teste bloqueio OLX/ImovelWeb"
on:
  workflow_dispatch:
    inputs:
      variantes:
        description: "variantes"
        default: "fetch headless-new warp chrome-headed tor"
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev
      - name: Cache do Chromium
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi
      - name: Instalar Tor e Cloudflare WARP (modo proxy SOCKS5 :40000)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp tor >/dev/null
          sleep 3
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy || true
          warp-cli --accept-tos connect || true
          sleep 5
          warp-cli --accept-tos status || true
          curl -s -m 15 --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -E 'ip=|loc=|warp=' || true
          curl -s -m 30 --socks5-hostname 127.0.0.1:9050 https://www.cloudflare.com/cdn-cgi/trace | grep -E 'ip=|loc=' || true
      - name: Testes
        run: xvfb-run -a node scripts_teste/teste_bloqueio.js ${{ inputs.variantes }}
